name: Publish on Release

# This workflow handles automatic publishing when a GitHub release is created
# For manual releases, use the CI/CD workflow with a release_type parameter

on:
  release:
    types: [published]

jobs:
  publish-from-release:
    name: Publish from GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build package
        run: npm run build

      - name: Create .npmrc
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc

      - name: Publish to npm (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Configure package for GitHub Packages
        run: |
          # Create a modified package.json with scoped name for GitHub Packages
          node -e "
          const pkg = require('./package.json');
          pkg.name = '@${{ github.repository_owner }}/' + pkg.name;
          pkg.publishConfig = {
            registry: 'https://npm.pkg.github.com'
          };
          require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}